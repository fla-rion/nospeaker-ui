name: Build noSpeakerUI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build-app.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: noSpeakerUI-macos
          path: build/noSpeakerUI.app
